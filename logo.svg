<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 3D मैटेलिक सिल्वर इफ़ेक्ट -->
    <linearGradient id="metal3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#D1D5DB"/>
      <stop offset="50%" stop-color="#9CA3AF"/>
      <stop offset="80%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <!-- 3D परछाई (Shadow) -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- प्रीमियम डार्क बैकग्राउंड (Rounded Square) -->
  <rect width="512" height="512" rx="110" fill="#0A0A0A" />
  
  <!-- हल्का मैटेलिक बॉर्डर -->
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="url(#metal3D)" stroke-width="8" opacity="0.3"/>
  
  <!-- 3D शॉपिंग ट्रॉली (Shopping Cart) -->
  <g filter="url(#shadow)">
    <!-- ट्रॉली का हैंडल और ढांचा -->
    <path d="M 80 120 L 140 120 L 190 320 L 400 320 L 450 150 L 148 150" fill="none" stroke="url(#metal3D)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ट्रॉली के बीच की डिज़ाइन लाइन -->
    <line x1="175" y1="235" x2="425" y2="235" stroke="url(#metal3D)" stroke-width="24" stroke-linecap="round"/>
    <!-- ट्रॉली के 3D पहिए -->
    <circle cx="230" cy="400" r="32" fill="url(#metal3D)"/>
    <circle cx="370" cy="400" r="32" fill="url(#metal3D)"/>
  </g>
</svg>
